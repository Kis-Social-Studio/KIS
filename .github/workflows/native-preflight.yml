name: Compilation native de recette
on:
  workflow_dispatch:
    inputs:
      run_native_build:
        description: "Lancer les compilations de recette"
        type: boolean
        default: false
  push:
    branches: [developpement/regroupement]

permissions:
  contents: read

concurrency:
  group: native-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_native_build) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-preflight]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier l’environnement Android
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" ||
            sdkmanager "platforms;android-36"
      - name: Installer et générer
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npm run prepare:web
          ./node_modules/.bin/cap add android
      - name: Compiler le build de débogage
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Préparer le bundle Android Release non signé
        working-directory: mobile/android
        run: |
          bash ./gradlew --no-daemon :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab

  ios:
    if: >-
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_native_build) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-preflight]')))
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Installer et générer
        working-directory: mobile
        run: |
          xcodebuild -version
          npm ci --no-audit --no-fund
          npm run prepare:web
          ./node_modules/.bin/cap add ios
          node set-ios-target.mjs
      - name: Compiler pour le simulateur
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/ios/Build/Products/Debug-iphonesimulator/App.app"
      - name: Compiler iOS Release pour appareil sans signature
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          test -d "$RUNNER_TEMP/ios-device/Build/Products/Release-iphoneos/App.app"
