<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIS Social Studio</title><style>body{margin:0;background:#101722;color:white;font:18px system-ui}main{max-width:680px;margin:auto;padding:20px}h1{font-size:64px;color:#ffdf38;font-style:italic;margin:12px 0;text-shadow:4px 4px #d92739}header{border-bottom:5px solid #1688dc}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;font-weight:bold;min-height:56px;padding:12px;border:2px solid #fff;border-radius:14px;background:#075da8;color:white;cursor:pointer}button:focus-visible{outline:4px solid #ffdf38;outline-offset:3px}nav button:nth-child(2){background:#a51d30}nav button:nth-child(3){background:#ffdf38;color:#111}section{margin-top:24px;padding:16px;border:1px solid #8295a9;border-radius:16px}label{display:block;margin:12px 0}input{font:inherit}body.large{font-size:23px}body.classic h1{font-style:normal;text-shadow:none}small{display:block;margin:16px 0} [hidden]{display:none!important}</style></head><body><main><header><h1>Kis ★</h1><p>Signature Kisangani Excellence</p><button id="settings">⚙ Paramètres</button></header><small>Prototype local — aucun compte ni échange réel.</small><nav aria-label="Modules"><button data-panel="social">👥 Kis Social</button><button data-panel="chat">💬 Kis Chat</button><button data-panel="moments">▣ Kis Moments</button><button data-panel="call">▸ Kis Call</button></nav><section id="panel" aria-live="polite"><h2 id="heading">Accueil</h2><p id="description">Choisissez un module.</p></section><section id="preferences" hidden><h2>Paramètres</h2><label><input type="checkbox" id="large"> Texte agrandi</label><label><input type="checkbox" id="classic"> Texte classique</label><h3>Super Sécurité</h3><p>Protections à implémenter et vérifier.</p><h3>Kis Verified</h3><p>Identité, Confiance, Excellence — certifications non actives.</p><button id="close">Fermer les paramètres</button></section></main><script>'use strict';const modules={social:['Kis Social','Fil social et publications : service à connecter.'],chat:['Kis Chat','Messagerie, vidéo et messages éphémères : services à connecter.'],moments:['Kis Moments','Photos, vidéos et albums : service à connecter.'],call:['Kis Call','Appels vidéo et chat pendant les appels : services à connecter.']};const el=id=>document.getElementById(id);document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>{const m=modules[b.dataset.panel];el('heading').textContent=m[0];el('description').textContent=m[1];el('preferences').hidden=true;}));el('settings').addEventListener('click',()=>{el('preferences').hidden=false;el('large').focus()});el('close').addEventListener('click',()=>{el('preferences').hidden=true;el('settings').focus()});for(const id of ['large','classic'])el(id).addEventListener('change',()=>document.body.classList.toggle(id,el(id).checked));</script></body></html>
